<!DOCTYPE html>
<html>
    <head>
        <title>Giulian Giannone Portfolio Website</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/contact.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header class="navbar">
            <a href="index.html" class="nav-icon">
                <img src="images/test.png" alt="Home">
            </a>
            <nav class="nav-links">
                <a href="portfolio.html">Portfolio</a>
                <a href="resume.html">Resume</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>
        <div id="block-grid"></div>

        <main class="container">
            <section class="contact-card">
                <div class="contact-intro">
                    <h1>Get in touch</h1>
                    <p>Share a few details about your project or idea and I’ll reach out asap!</p>
                </div>

                <form
                    class="contact-form"
                    id="contact-form"
                    action="https://formspree.io/f/mrpplwld"
                    method="POST"
                >
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" placeholder="Your name" required>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>

                    <label for="website">Work page</label>
                    <input id="website" name="website" type="url" placeholder="https://linkedin.com/in/yourname">

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Tell me about your project or idea" required></textarea>

                    <input type="hidden" name="_subject" value="New message from your portfolio website">

                    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

                    <button type="submit">Send message</button>

                    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                </form>
            </section>
        </main>

        <script>
            const form = document.getElementById('contact-form');
            const status = document.getElementById('form-status');
            const button = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const originalText = button.textContent;
                button.disabled = true;
                button.textContent = 'Sending...';
                status.textContent = '';
                status.className = 'form-status';

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        form.reset();
                        status.textContent = 'Thanks! Your message was sent, and I’ll get back to you soon.';
                        status.classList.add('success');
                    } else {
                        throw new Error('Request failed');
                    }
                } catch (err) {
                    status.textContent = 'Something went wrong. Please try again, or email me directly at giuliangiannone7@gmail.com.';
                    status.classList.add('error');
                } finally {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            });
        </script>
    </body>
</html>
